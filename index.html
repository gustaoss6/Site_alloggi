    // --- COMPONENTE PRINCIPAL ALLOGGI APP ---
    function AlloggiApp() {
      // Filtros de Estado
      const [purpose, setPurpose] = useState('todos'); // 'todos', 'Comprar', 'Alugar'
      const [propertyType, setPropertyType] = useState('todos');
      const [location, setLocation] = useState('todos');
      const [minPrice, setMinPrice] = useState('');
      const [maxPrice, setMaxPrice] = useState('');
      const [bedrooms, setBedrooms] = useState('qualquer');
      const [parking, setParking] = useState('qualquer');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('relevance');
      const [filterApplied, setFilterApplied] = useState(false);

      // Estado de Favoritos (persistência local)
      const [favorites, setFavorites] = useState(() => {
        try {
          const saved = localStorage.getItem('alloggi_favorites');
          return saved ? JSON.parse(saved) : [1, 4];
        } catch (e) {
          return [1, 4];
        }
      });
      const [showFavoritesOnly, setShowFavoritesOnly] = useState(false);

      // Modal de Detalhes
      const [selectedProperty, setSelectedProperty] = useState(null);
      const [galleryIndex, setGalleryIndex] = useState(0);

      // Modal de Anunciar Imóvel
      const [isAnunciarOpen, setIsAnunciarOpen] = useState(false);
      const [anunciarSuccess, setAnunciarSuccess] = useState(false);

      // Agendamento de Visita no Modal
      const [scheduleSubmitted, setScheduleSubmitted] = useState(false);
      const [scheduleData, setScheduleData] = useState({
        name: '',
        email: '',
        phone: '',
        date: '',
        period: 'Manhã (09h - 12h)',
        notes: ''
      });

      // Menu Mobile & Toasts
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // Newsletter
      const [newsletterEmail, setNewsletterEmail] = useState('');
      const [newsletterSuccess, setNewsletterSuccess] = useState(false);

      // Sincronizar favoritos com localStorage
      useEffect(() => {
        try {
          localStorage.setItem('alloggi_favorites', JSON.stringify(favorites));
        } catch (e) {}
      }, [favorites]);

      // Fechar modais ao pressionar tecla Escape
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (selectedProperty) handleCloseDetails();
            if (isAnunciarOpen) setIsAnunciarOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [selectedProperty, isAnunciarOpen]);

      // Feedback em Toast temporário
      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3500);
      };

      // Toggle favorito
      const toggleFavorite = (e, id) => {
        e && e.stopPropagation();
        if (favorites.includes(id)) {
          setFavorites(favorites.filter(item => item !== id));
          showToast("Imóvel removido dos seus favoritos.");
        } else {
          setFavorites([...favorites, id]);
          showToast("Imóvel adicionado à sua lista de favoritos!");
        }
      };

      // Resetar todos os filtros
      const handleResetFilters = () => {
        setPurpose('todos');
        setPropertyType('todos');
        setLocation('todos');
        setMinPrice('');
        setMaxPrice('');
        setBedrooms('qualquer');
        setParking('qualquer');
        setSearchQuery('');
        setSortBy('relevance');
        setShowFavoritesOnly(false);
        setFilterApplied(false);
        showToast("Filtros limpos com sucesso.");
      };

      // Filtragem reativa dinâmica dos imóveis
      const filteredProperties = useMemo(() => {
        return PROPERTIES_DATA.filter(property => {
          // Filtro de Favoritos
          if (showFavoritesOnly && !favorites.includes(property.id)) {
            return false;
          }

          // Filtro de Finalidade (Comprar / Alugar)
          if (purpose !== 'todos' && property.purpose.toLowerCase() !== purpose.toLowerCase()) {
            return false;
          }

          // Filtro de Tipo de Imóvel
          if (propertyType !== 'todos' && property.type.toLowerCase() !== propertyType.toLowerCase()) {
            return false;
          }

          // Filtro de Localização / Bairro
          if (location !== 'todos' && property.neighborhood.toLowerCase() !== location.toLowerCase()) {
            return false;
          }

          // Filtro de Preço Mínimo
          if (minPrice && Number(minPrice) > 0 && property.price < Number(minPrice)) {
            return false;
          }

          // Filtro de Preço Máximo
          if (maxPrice && Number(maxPrice) > 0 && property.price > Number(maxPrice)) {
            return false;
          }

          // Filtro de Quartos
          if (bedrooms !== 'qualquer') {
            const minBedrooms = parseInt(bedrooms, 10);
            if (property.bedrooms < minBedrooms) return false;
          }

          // Filtro de Vagas
          if (parking !== 'qualquer') {
            const minParking = parseInt(parking, 10);
            if (property.parking < minParking) return false;
          }

          // Busca textual livre (título, bairro, código, descrição)
          if (searchQuery.trim() !== '') {
            const query = searchQuery.toLowerCase();
            const matchTitle = property.title.toLowerCase().includes(query);
            const matchBairro = property.neighborhood.toLowerCase().includes(query);
            const matchCode = property.code.toLowerCase().includes(query);
            const matchDesc = property.description.toLowerCase().includes(query);
            if (!matchTitle && !matchBairro && !matchCode && !matchDesc) {
              return false;
            }
          }

          return true;
        }).sort((a, b) => {
          if (sortBy === 'price-asc') return a.price - b.price;
          if (sortBy === 'price-desc') return b.price - a.price;
          if (sortBy === 'area-desc') return b.area - a.area;
          return 0; // Mais relevantes (ordem original de curadoria)
        });
      }, [purpose, propertyType, location, minPrice, maxPrice, bedrooms, parking, searchQuery, sortBy, showFavoritesOnly, favorites]);

      // Abrir modal de detalhes
      const handleOpenDetails = (property) => {
        setSelectedProperty(property);
        setGalleryIndex(0);
        setScheduleSubmitted(false);
        setScheduleData({
          name: '',
          email: '',
          phone: '',
          date: '',
          period: 'Manhã (09h - 12h)',
          notes: ''
        });
        document.body.style.overflow = 'hidden';
      };

      const handleCloseDetails = () => {
        setSelectedProperty(null);
        document.body.style.overflow = 'auto';
      };

      // Submissão do agendamento
      const handleScheduleSubmit = (e) => {
        e.preventDefault();
        setScheduleSubmitted(true);
        showToast("Solicitação de agendamento enviada! Nosso consultor entrará em contato.");
      };

      // Submissão de Anunciar Imóvel
      const handleAnunciarSubmit = (e) => {
        e.preventDefault();
        setAnunciarSuccess(true);
        setTimeout(() => {
          setIsAnunciarOpen(false);
          setAnunciarSuccess(false);
          showToast("Imóvel cadastrado para avaliação da curadoria Alloggi!");
        }, 2200);
      };

      // Compartilhar imóvel
      const handleShare = (property) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(window.location.href);
          showToast(`Link de ${property.title} copiado para a área de transferência!`);
        } else {
          showToast("Link pronto para compartilhamento.");
        }
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          
          {/* TOAST FLUTUANTE */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-forest text-white px-5 py-3.5 rounded-xl shadow-2xl flex items-center space-x-3 border border-sage/20 animate-fade-in">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald"></span>
              <p className="text-sm font-medium">{toast}</p>
            </div>
          )}

          {/* ======================================================== */}
          {/* 1. CABEÇALHO (NAVBAR)                                     */}
          {/* ======================================================== */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-100 shadow-sm transition-all duration-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                
                {/* Logo Tipográfico Elegante "Alloggi" */}
                <a href="#" className="flex items-center space-x-3 group">
                  <div className="w-10 h-10 rounded-xl bg-forest flex items-center justify-center text-sage font-serif font-bold text-2xl shadow-md transition-transform duration-300 group-hover:scale-105">
                    A
                  </div>
                  <div>
                    <span className="font-serif text-2xl sm:text-3xl font-bold tracking-tight text-forest block leading-none">
                      Alloggi
                    </span>
                    <span className="text-[10px] tracking-[0.25em] uppercase font-semibold text-emerald-light block mt-0.5">
                      Imóveis de Alto Padrão
                    </span>
                  </div>
                </a>

                {/* Links de Navegação Desktop */}
                <nav className="hidden md:flex items-center space-x-8">
                  <a href="#catalogo" onClick={() => { setPurpose('todos'); setShowFavoritesOnly(false); }} className="text-sm font-medium text-charcoal hover:text-emerald transition-colors">
                    Início
                  </a>
                  <a href="#catalogo" onClick={() => { setPurpose('Comprar'); setShowFavoritesOnly(false); }} className="text-sm font-medium text-charcoal hover:text-emerald transition-colors">
                    Comprar
                  </a>
                  <a href="#catalogo" onClick={() => { setPurpose('Alugar'); setShowFavoritesOnly(false); }} className="text-sm font-medium text-charcoal hover:text-emerald transition-colors">

                  className="absolute top-4 right-4 text-charcoal-muted hover:text-forest"
                >
                  <Icon name="x" className="w-6 h-6" />
                </button>

                <div className="text-center mb-6">
                  <div className="w-12 h-12 rounded-2xl bg-sage flex items-center justify-center text-forest mx-auto mb-3">
                    <Icon name="sparkles" className="w-6 h-6 text-emerald" />
                  </div>
                  <h3 className="font-serif text-2xl font-bold text-forest">
                    Anuncie seu Imóvel na Alloggi
                  </h3>
                  <p className="text-xs sm:text-sm text-charcoal-muted mt-1">
                    Conectamos sua propriedade aos compradores e investidores mais qualificados do mercado nacional e internacional.
                  </p>
                </div>

                {anunciarSuccess ? (
                  <div className="p-8 bg-sage/50 rounded-2xl text-center">
                    <Icon name="check" className="w-10 h-10 text-emerald mx-auto mb-3" />
                    <h4 className="font-serif text-lg font-bold text-forest mb-1">
                      Informações Enviadas com Sucesso!
                    </h4>
                    <p className="text-xs text-charcoal-muted">
                      Nossa equipe de avaliação patrimonial entrará em contato para agendar o ensaio fotográfico profissional.
                    </p>
                  </div>
                ) : (
                  <form onSubmit={handleAnunciarSubmit} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-charcoal uppercase mb-1">Seu Nome Completo *</label>
                      <input required type="text" placeholder="Nome do proprietário" className="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-emerald focus:outline-none" />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-charcoal uppercase mb-1">WhatsApp / Telefone *</label>
                        <input required type="tel" placeholder="(11) 99999-9999" className="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-emerald focus:outline-none" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-charcoal uppercase mb-1">E-mail *</label>
                        <input required type="email" placeholder="seu@email.com" className="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-emerald focus:outline-none" />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-charcoal uppercase mb-1">Tipo de Imóvel</label>
                        <select className="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-emerald focus:outline-none">
                          <option>Apartamento</option>
                          <option>Cobertura</option>
                          <option>Casa em Condomínio</option>
                          <option>Casa de Bairro</option>
                          <option>Laje Corporativa</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-charcoal uppercase mb-1">Bairro em São Paulo</label>
                        <input required type="text" placeholder="ex: Jardins, Itaim Bibi" className="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-emerald focus:outline-none" />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-charcoal uppercase mb-1">Área Aproximada (m²)</label>
                        <input type="number" placeholder="ex: 280" className="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-emerald focus:outline-none" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-charcoal uppercase mb-1">Preço Estimado (R$)</label>
                        <input type="text" placeholder="ex: 5.500.000" className="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-emerald focus:outline-none" />
                      </div>
                    </div>

                    <div className="pt-2">
                      <button
                        type="submit"
                        className="w-full bg-forest hover:bg-forest-light text-white font-semibold py-3.5 rounded-xl shadow-md transition-all active:scale-95"
                      >
                        Enviar Imóvel para Curadoria
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* 5. RODAPÉ COMPLETO EM VERDE-FLORESTA (#1B4332)           */}
          {/* ======================================================== */}
          <footer id="contato" className="bg-forest text-white pt-16 pb-12 border-t border-forest-light">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-10 pb-12 border-b border-forest-light/60">
                
                {/* Coluna 1: Marca & Manifesto */}
                <div className="lg:col-span-2 space-y-4">
                  <div className="flex items-center space-x-3">
                    <div className="w-10 h-10 rounded-xl bg-sage flex items-center justify-center text-forest font-serif font-bold text-2xl shadow-sm">
                      A
                    </div>
                    <span className="font-serif text-3xl font-bold tracking-tight text-white">
                      Alloggi
                    </span>
                  </div>
                  <p className="text-sm text-sage/80 leading-relaxed max-w-sm">
                    Imobiliária boutique especializada no mercado de altíssimo padrão em São Paulo. Unimos sensibilidade estética, curadoria arquitetônica e total discrição.
                  </p>
                  
                  {/* Endereço Fictício */}
                  <div className="pt-2 text-xs text-sage/70 space-y-1">
                    <p className="flex items-center space-x-2">
                      <Icon name="pin" className="w-4 h-4 text-emerald-light" />
                      <span>Av. Brigadeiro Faria Lima, 3477 - 14º andar, Itaim Bibi</span>
                    </p>
                    <p className="pl-6">São Paulo - SP, 04538-133</p>
                    <p className="pl-6 font-semibold text-sage">CRECI 38.492-J</p>
                  </div>
                </div>

                {/* Coluna 2: Links Rápidos */}
                <div>
                  <h4 className="text-xs font-bold uppercase tracking-wider text-sage mb-4">
                    Navegação
                  </h4>
                  <ul className="space-y-2.5 text-sm text-white/80">
                    <li><a href="#catalogo" onClick={() => setPurpose('Comprar')} className="hover:text-sage transition-colors">Comprar Imóveis</a></li>
                    <li><a href="#catalogo" onClick={() => setPurpose('Alugar')} className="hover:text-sage transition-colors">Locação de Alto Padrão</a></li>
                    <li><a href="#catalogo" onClick={() => setPropertyType('Cobertura')} className="hover:text-sage transition-colors">Coberturas Exclusivas</a></li>
                    <li><a href="#catalogo" onClick={() => setPropertyType('Casa')} className="hover:text-sage transition-colors">Mansões & Casas</a></li>
                    <li><a href="#diferenciais" className="hover:text-sage transition-colors">Sobre a Alloggi</a></li>
                  </ul>
                </div>

                {/* Coluna 3: Bairros em Destaque */}
                <div>
                  <h4 className="text-xs font-bold uppercase tracking-wider text-sage mb-4">
                    Bairros Nobres
                  </h4>
                  <ul className="space-y-2.5 text-sm text-white/80">
                    <li><a href="#catalogo" onClick={() => setLocation('Jardins')} className="hover:text-sage transition-colors">Jardins & Jd. Europa</a></li>
                    <li><a href="#catalogo" onClick={() => setLocation('Itaim Bibi')} className="hover:text-sage transition-colors">Itaim Bibi</a></li>
                    <li><a href="#catalogo" onClick={() => setLocation('Vila Nova Conceição')} className="hover:text-sage transition-colors">Vila Nova Conceição</a></li>
                    <li><a href="#catalogo" onClick={() => setLocation('Pinheiros')} className="hover:text-sage transition-colors">Pinheiros & Alto de Pinheiros</a></li>
                    <li><a href="#catalogo" onClick={() => setLocation('Higienópolis')} className="hover:text-sage transition-colors">Higienópolis</a></li>
                  </ul>
                </div>

                {/* Coluna 4: Canais de Atendimento & Newsletter */}
                <div>
                  <h4 className="text-xs font-bold uppercase tracking-wider text-sage mb-4">
                    Atendimento Privativo
                  </h4>
                  <div className="space-y-2.5 text-sm text-white/80 mb-6">
                    <p className="font-semibold text-white">(11) 3090-8800</p>
                    <p className="text-emerald-light font-medium flex items-center space-x-1.5">
                      <Icon name="whatsapp" className="w-4 h-4 text-emerald-light" />
                      <span>(11) 99999-8888</span>
                    </p>
                    <p className="text-xs text-sage/70">contato@alloggiimoveis.com.br</p>
                    <p className="text-xs text-sage/70">Segunda a Sábado, das 08h às 20h</p>
                  </div>

                  {/* Newsletter */}
                  <div>
                    <span className="text-xs text-sage block mb-1.5 font-medium">Receba oportunidades off-market:</span>
                    {newsletterSuccess ? (
                      <div className="text-xs text-sage bg-forest-light px-3 py-2 rounded-lg">
                        E-mail cadastrado com sucesso!
                      </div>
                    ) : (
                      <form onSubmit={(e) => { e.preventDefault(); setNewsletterSuccess(true); showToast("Inscrito na newsletter da Alloggi!"); }} className="flex">
                        <input 
                          type="email" 
                          required
                          value={newsletterEmail}
                          onChange={(e) => setNewsletterEmail(e.target.value)}
                          placeholder="Seu e-mail..."
                          className="bg-forest-dark border border-forest-light px-3 py-2 text-xs rounded-l-lg text-white focus:outline-none focus:border-sage w-full placeholder:text-white/40"
                        />
                        <button type="submit" className="bg-sage hover:bg-white text-forest px-3 py-2 rounded-r-lg text-xs font-bold transition-colors">
                          OK
                        </button>
                      </form>
                    )}
                  </div>
                </div>

              </div>

              {/* Linha Inferior do Rodapé: Copyright e Redes Sociais */}
              <div className="pt-8 flex flex-col sm:flex-row items-center justify-between text-xs text-sage/70 gap-4">
                <p>
                  © {new Date().getFullYear()} Alloggi Imóveis de Alto Padrão. Todos os direitos reservados.
                </p>

                <div className="flex items-center space-x-6 text-white/70">
                  <a href="#" className="hover:text-sage transition-colors">Instagram</a>
                  <a href="#" className="hover:text-sage transition-colors">LinkedIn</a>
                  <a href="#" className="hover:text-sage transition-colors">YouTube</a>
                  <a href="#" className="hover:text-sage transition-colors">Privacidade</a>
                  <a href="#" className="hover:text-sage transition-colors">Termos</a>
                </div>
              </div>

            </div>
          </footer>

        </div>
      );
    }

    // Renderização no elemento DOM raiz
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AlloggiApp />);
  </script>
